name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # better-sqlite3 ships prebuilt binaries for linux-x64, but node-gyp is
      # still invoked on some platforms. --ignore-scripts keeps CI fast and
      # deterministic; the prebuild is loaded at runtime instead.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Test (security regression suite)
        run: npm test
        env:
          NODE_ENV: test
          FOUNDER_ACCESS_KEY: ci-founder-key
          WORKER_SECRET: ci-worker-secret
          JWT_SECRET: ci-jwt-secret-not-used-outside-ci

      - name: Build
        run: npm run build
